<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>November For You 🍂💗🌸</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&display=swap">
<style>
:root{--bg:#fff0f5;--bg3:#ffe0ec;--bg2:#ffd3e4;--card:#fff;--ink:#43344a;--soft:#8a7a95;--p:#e8709a;--g:#3fa27a;--b:#4d94dd;--chip:#ffd6e5;--sh:0 8px 26px rgba(130,150,210,.28);color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1822;--bg3:#331c29;--bg2:#3d2131;--card:#262230;--ink:#f4ecff;--soft:#b9aacb;--p:#ff8fb3;--g:#7fdcb0;--b:#8cc3ff;--chip:#4a2c3c;--sh:0 8px 26px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a1822;--bg3:#331c29;--bg2:#3d2131;--card:#262230;--ink:#f4ecff;--soft:#b9aacb;--p:#ff8fb3;--g:#7fdcb0;--b:#8cc3ff;--chip:#4a2c3c;--sh:0 8px 26px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,var(--bg),var(--bg3) 55%,var(--bg2));background-attachment:fixed;color:var(--ink);font-family:'Mali','Sarabun','Noto Sans Thai',system-ui,sans-serif;line-height:1.7;overflow-x:hidden}
main{max-width:520px;margin:0 auto;padding:28px 20px 110px;position:relative;z-index:1}
section{text-align:center;margin-bottom:44px}
.tag{display:inline-block;background:var(--chip);color:var(--p);padding:4px 16px;border-radius:99px;font-size:.9rem}
h1{font-size:2.6rem;line-height:1.2;margin:14px 0 6px}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--p),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:1.25rem;margin:0 0 6px}
.sub{color:var(--soft);margin:0}
.hero .big{font-size:3.4rem;display:block;animation:sway 3s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(10deg) translateY(-4px)}}
.msg{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:18px 18px;margin-top:18px;text-align:left}
/* ปฏิทิน */
.cal{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:14px 12px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.grid .h{font-size:.75rem;color:var(--soft)}
.grid button{aspect-ratio:1/1;padding:0;border:0;border-radius:14px;background:var(--chip);color:var(--ink);font:inherit;font-size:.95rem;cursor:pointer;box-shadow:none;position:relative}
.grid button.open{background:linear-gradient(135deg,#ffc9dc,#cfe6ff);color:#43344a;font-weight:600}
.grid button.lock{opacity:.55}
.grid button.today{outline:3px solid var(--g)}
.grid button.sel{outline:3px solid var(--p)}
.grid button i{position:absolute;right:3px;top:0;font-size:.6rem;font-style:normal}
.note{min-height:76px;margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--chip);text-align:left;font-size:.95rem}
.wig{animation:wig .5s}
@keyframes wig{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-3px)}}
.pw{width:210px;font:inherit;font-size:1.5rem;letter-spacing:.4em;text-align:center;border:2px solid var(--chip);border-radius:16px;padding:8px;margin-bottom:10px;background:var(--bg);color:var(--ink)}
.vwrap{border-radius:20px;overflow:hidden;box-shadow:var(--sh);background:#000;margin-top:14px}
.vwrap{position:relative}
.vwrap video{width:100%;display:block;object-fit:cover;aspect-ratio:1/1;max-height:none;background:#000}
.vwrap.fit video{object-fit:contain;aspect-ratio:auto;max-height:80vh}
.vtog{position:absolute;top:10px;right:10px;z-index:2;border:0;border-radius:99px;padding:6px 14px;font:inherit;font-size:.8rem;color:#fff;background:rgba(0,0,0,.45);cursor:pointer}
.gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));background:linear-gradient(160deg,var(--bg),var(--bg3) 55%,var(--bg2));cursor:pointer;transition:opacity .7s}
.gate.out{opacity:0;pointer-events:none}
.gc{display:flex;flex-direction:column;align-items:center;gap:6px}
.ge{font-size:4.5rem;line-height:1.2;animation:pulse 1.6s infinite}
.gc b{font-size:1.8rem}
.gc span{color:var(--soft)}
@media (prefers-reduced-motion:reduce){.ge{animation:none!important}.gate{transition:none}}
.vph{background:linear-gradient(135deg,#c7ecd5,#cfe6ff);aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2.4rem;color:#43344a}
.vph small{font-size:.8rem}
.player{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:99px;box-shadow:var(--sh);padding:8px 18px 8px 8px;max-width:calc(100vw - 24px);color:var(--ink)}
.player[hidden]{display:none}
.player button{width:42px;height:42px;padding:0;border:0;border-radius:50%;background:linear-gradient(135deg,#e8709a,#5a9be0);color:#fff;font-size:1.1rem;cursor:pointer;flex:none}
.player .disc{font-size:1.4rem}
.player.on .disc{animation:spin 3s linear infinite}
.player.pulse button{animation:pulse 1.6s infinite}
.pt{font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){.player .disc,.player button{animation:none!important}}
/* เช็กลิสต์ */
.todo{margin-top:14px;display:grid;gap:10px;text-align:left}
.todo label{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px 16px;box-shadow:var(--sh);cursor:pointer}
.todo input{width:22px;height:22px;accent-color:#e8709a;flex:none}
.todo input:checked+span{text-decoration:line-through;color:var(--soft)}
button.main{font:inherit;font-weight:600;background:linear-gradient(135deg,#e8709a,#5a9be0);color:#fff;border:0;border-radius:99px;padding:12px 28px;font-size:1rem;cursor:pointer;box-shadow:0 4px 14px rgba(110,140,220,.4)}
.letter{background:var(--card);border-radius:20px;padding:22px 20px;margin-top:16px;text-align:left;white-space:pre-line;display:none;box-shadow:var(--sh)}
.letter.open{display:block;animation:pop .5s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
footer{text-align:center;color:var(--soft);font-size:.9rem}
.leaf{position:fixed;top:-40px;pointer-events:none;z-index:0;opacity:.8;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) translateX(40px) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.leaf{display:none}.hero .big,.wig,.letter.open{animation:none}}
</style>
</head>
<body>
<main>
  <section class="hero">
    <span class="big">🍂</span>
    <span class="tag">1 พฤศจิกายน 2026</span>
    <h1>Hello,<br><em>November</em></h1>
    <p class="sub" id="to">เดือนพฤศจิกายนแล้วนะคะ</p>
    <div class="msg" id="hello"></div>
  </section>

  <section>
    <h2>ปฏิทินเดือนนี้ของเรา 🗓️</h2>
    <p class="sub">ใส่รหัสผ่านวัน/เดือน/ปี ที่คบกัน🔐</p>
    <div class="cal" id="lock">
      <input id="pw" class="pw" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="••••••" aria-label="รหัสผ่าน"><br>
      <button class="main" id="pwbtn">ปลดล็อก 🔓</button>
      <div class="note" id="note">ใส่รหัส 6 หลักนะ 💗</div>
    </div>
    <div class="vwrap" id="vid" hidden></div>
  </section>

  <section>
    <h2>สิ่งที่อยากทำกับเธอในเดือนนี้ ✅</h2>
    <p class="sub">มาทำภารกิจเดือนนี้ไปด้วยกันนะคะเธอ</p>
    <div class="todo" id="todo"></div>
  </section>

  <section>
    <h2>พร้อมอ่านมั้ยคะ</h2>
    <button class="main" id="btn">เปิดจดหมาย 💌</button>
    <div class="letter" id="letter"></div>
  </section>

  <footer><p id="from"></p></footer>
</main>

<div class="gate" id="gate"><div class="gc"><div class="ge">💌</div><b>Hello, November</b><span>แตะเพื่อเปิดเซอร์ไพรส์ 🍂</span></div></div>

<div class="player pulse" id="player"><button id="pbtn" aria-label="เล่น/หยุดเพลง">▶</button><span class="disc">💿</span><span class="pt" id="ptitle"></span></div>

<script>
// ✏️ แก้ข้อความตรงนี้ได้เลย
var CONFIG = {
  to: 'เดือนพฤศจิกายนแล้วนะคะ',
  from: 'เค้ารักเธอ 💗',
  password: '310869',
  video: {src:'ba7c90bc-f077-4b14-8d9a-71e8baae1a62.mp4'},
  music: {src:'ใจรัก - สุชาติ ชวางกุร _ cover โอปอ.mp3', title:'ใจรัก – สุชาติ ชวางกูร 🎵'},
  hello: 'I Want you to continue being The absolute best part of my life 🤍💌',
  todo: ['เที่ยวด้วยกัน', 'กินข้าวด้วยกัน', 'ถ่ายรูปคู่กัน / ทำกิจกรรมร่วมกัน', 'ไปเดินทะเลบางแสนด้วยกัน', 'ไปลอยกระทงหรือเดินเล่นตอนเย็น', 'ไป BUU Open House', 'ไปอควาเรียมด้วยกัน', 'วิ่งออกกำลังกายด้วยกัน', 'ข้ามเดือนไปด้วยกัน', 'ทะเลาะกันน้อยลง/ไม่ทะเลาะกันเลย', 'นอนกอดกัน / นอนกับแฟน', 'Deeptalk (กันเดือนละครั้งก็ยังดี)'],
  letter: `Happy November kup ter 🩶 วันนี้ก็เป็นวันใหม่ของอีกเดือนแล้วนะคะ เดือนพฤศจิกายนมาถึงแล้ว เค้าคนนี้ก็ยังคงรักเธอเหมือนเดิม เพิ่มเติมคือเค้ารักเธอมากขึ้นในทุกๆวันเลย ไม่รู้เหมือนกันว่าทำไมยิ่งได้อยู่กับเธอ ได้รักเธอ ได้ใช้เวลาด้วยกันมากขึ้น เค้าก็ยิ่งอยากมีเธออยู่ในชีวิตไปนานๆ อยากมีเธออยู่ในทุกช่วงเวลาของชีวิตแบบที่เค้าพูดอยู่เสมอว่าเค้าอยากมีเธอตลอดไป เค้าไม่ได้พูดเล่นเลยนะคะ เค้าจริงจังกับความรู้สึกนี้มากๆ แล้วช่วงนี้เค้าก็แอบคิดถึงเรื่องมหาลัยของเราอยู่เหมือนกัน คิดแล้วก็ใจหายที่วันหนึ่งเราอาจจะไม่ได้เจอกันบ่อยเหมือนตอนนี้ อาจจะต้องใช้ชีวิตอยู่ห่างกันมากขึ้น เค้ายอมรับเลยว่าเค้าทำใจยากนิดนึงงืม ขอเวลาเค้าค่อยๆปรับความรู้สึกหน่อยนะคะ แต่ถึงเค้าจะใจหายแค่ไหน เค้าก็ยังอยากเห็นเธอได้ไปอยู่ในที่ที่เธออยากอยู่ ได้เรียนในคณะที่เธอใฝ่ฝัน และได้ทำตามความฝันของตัวเองอย่างเต็มที่ เค้าเชื่อมั่นในตัวเธอมากๆเลยนะ เชื่อว่าเธอทำได้ เชื่อว่าเธอจะค่อยๆเดินไปถึงสิ่งที่ตั้งใจไว้ได้แน่นอน เค้าจะพยายามเรียนรู้ที่จะยอมรับระยะทางและปรับตัวให้ได้ เพราะเค้าไม่อยากให้ความคิดถึงของเค้ากลายเป็นสิ่งที่ทำให้เธอต้องกังวลใจเลย เค้าอยากให้เธอได้เติบโต ได้เรียนรู้โลกกว้างๆ ได้ใช้ชีวิตในแบบที่เธออยากใช้ ส่วนเค้าก็จะคอยเป็นกำลังใจให้เธออยู่ตรงนี้นะคะ เค้ารักเธอมากจริงๆ รักมากจนบางครั้งก็ไม่รู้จะอธิบายออกมาเป็นคำพูดยังไงแล้วงืม เค้าอยากมีเธออยู่ในวันธรรมดาๆ อยากมีเธออยู่ในวันพิเศษ อยากมีเธออยู่ในทุกๆช่วงเวลาที่เรายังสามารถเดินไปด้วยกันได้ และเค้าก็หวังว่าวันหนึ่งเราจะได้ใช้ชีวิตอยู่ใกล้ๆกันอย่างที่เคยฝันไว้ ได้ตื่นมาเจอหน้ากัน ได้กินข้าวด้วยกัน ได้พากันไปเที่ยวในสถานที่ที่อยากไป ได้ขับรถเล่นด้วยกันในวันที่เหนื่อยล้า ได้กลับมาพักผ่อนข้างๆกันหลังจากผ่านวันที่วุ่นวายมา เค้าอยากดูแลเธอในเรื่องเล็กๆน้อยๆ อยากเห็นเธอกินของอร่อยแล้วมีความสุข อยากคอยถามว่าเหนื่อยไหม อยากคอยเป็นกำลังใจให้เธอในทุกเรื่องเลยนะคะ เค้าหวังกับอนาคตของเรามากจริงๆ และทุกครั้งที่เค้าพูดว่าอยากมีเธอตลอดไป เค้าหมายถึงแบบนั้นจริงๆนะ

อะไรที่ไม่ดีจากเดือนที่แล้ว อะไรที่ทำให้เธอเหนื่อย ทำให้เธอเสียใจ หรือมีเรื่องไหนที่ยังค้างอยู่ในใจ เค้าก็ขอให้เดือนใหม่นี้ค่อยๆทำให้ทุกอย่างดีขึ้นนะคะ เรื่องไหนที่ผ่านไปแล้วก็ปล่อยให้มันผ่านไป เก็บเอาไว้แค่บทเรียนกับความทรงจำดีๆก็พอ จากนี้ไปเค้าขอให้เธอได้พบเจอแต่เรื่องราวที่ใจดีกับเธอ ขอให้มีแต่คนที่มองเห็นคุณค่าของเธอ ขอให้ทุกวันที่ตื่นขึ้นมาเป็นวันที่มีเรื่องดีๆรออยู่ ขอให้เธอยิ้มได้เยอะๆ หัวเราะได้บ่อยๆ และมีความสุขกับเรื่องเล็กๆน้อยๆรอบตัว ขอให้สิ่งที่เธอหวังไว้ค่อยๆเป็นจริง ขอให้ทุกความตั้งใจของเธอไม่สูญเปล่า และขอให้เธอได้เห็นว่าความพยายามของตัวเองมีความหมายมากแค่ไหนนะคะ เค้าอยากให้เธอมีวันที่ได้พักผ่อนเต็มอิ่ม ได้นอนหลับสบายๆ ตื่นมาแล้วไม่เหนื่อย ไม่เพลีย ได้กินของอร่อยที่ชอบ ได้ทำสิ่งที่อยากทำ และได้ใช้ชีวิตอย่างมีความสุขในแบบของเธอเองเลย เดือนเกิดเค้าเค้าขอขอพรให้เธอก่อนที่จะเดือนใหม่ลาก่อนตุลาคมเดือนเกิด2569เค้าหวังว่าปีหน้าจะได้พูดกับเธอว่าลาก่อนตุลาคมเดือนเกิด2570กับเธออีกครั้ง เค้าขอพรให้เธอขอให้ทุกๆวันของเรามีแต่เรื่องดีดีมีกันและกัน ขอให้เธอหวังอยากได้อะไรก็ได้สิ่งนั้นไม่เจอความผิดหวังที่ผิดหวังมากจนเกินไปเค้าอยากให้ฌะอแอปปี้ขอให้เธอคิดอะไรขอพรอะไรเค้าขอให้เธอสมหวังทุกๆเรื่อง แล้วเค้าก็จะคอยภาวนาให้เธออยู่ตรงนี้แหละค่ะ ตั้งแต่เริ่มเขียนข้อความนี้จนถึงตอนจบ คนที่เค้านึกถึงก็ยังเป็นเธอเหมือนเดิม เค้าขอให้เธอได้รับสิ่งดีๆที่สมควรได้รับ ขอให้ความฝันของเธอพาเธอไปถึงปลายทางที่ตั้งใจไว้ และขอให้ระหว่างทางนั้นเธอมีความสุขกับชีวิตของตัวเองด้วยนะคะ ถ้าวันไหนเหนื่อยก็อย่าลืมกันมาหาเค้าได้เลย ไม่ต้องเก็บทุกอย่างไว้คนเดียว เค้าอาจจะทำให้ทุกปัญหาหายไปไม่ได้ แต่เค้าพร้อมจะอยู่ข้างๆและคอยเป็นกำลังใจให้เธอเสมอเลยนะ

เค้าอยากให้เธอรู้ไว้ว่าการมีเธออยู่ในชีวิตมันเป็นเรื่องที่ดีมากๆสำหรับเค้าจริงๆ ตั้งแต่วันที่เราได้รู้จักกันจนถึงวันนี้ เค้ามีเรื่องให้ยิ้มมากขึ้น มีเธอให้คิดถึงในทุกๆวัน และมีความสุขกับวันธรรมดาๆมากกว่าเดิมเยอะเลย แค่เธอทักมาหา แค่เห็นชื่อเธอขึ้นมาบนหน้าจอ หรือแค่ได้อ่านข้อความที่เธอส่งมา บางวันเค้าอาจจะเหนื่อยหรือมีเรื่องให้คิดมากมาย แต่พอได้คุยกับเธอทุกอย่างมันดีมากดีหายเหนื่อยเลยแหละงืมๆๆๆ เธอไม่จำเป็นต้องทำอะไรพิเศษให้เค้า แค่เป็นเธอคนเดิมที่อยู่ตรงนี้ก็ทำให้เค้ามีความสุขได้มากแล้ว แค่เธออยู่กับเค้านึกถึงเค้าตลอดในทุกเรื่องรู้สึกไม่สบายใจก็มาหาเค้าทำให้เค้ารู้สึกเธอสบายใจจะอยู่กับเค้าเค้าก็รู้สึกดีมากไม่ต้องมีไรพิเศษเลยจริงๆ ชอบที่เรามีเรื่องเล็กๆน้อยๆมาเล่าให้กันฟังได้เรื่อยๆ ชอบที่เราคุยกันเรื่องไร้สาระไปเรื่อยแต่กลับทำให้มีความสุข เค้าชอบความรู้สึกที่ได้มีใครสักคนให้คิดถึงแล้วก็อยากกลับไปหา เค้าอยากให้เธอรู้ว่าเธอมีความหมายกับเค้ามากกว่าที่เค้าพูดออกมาได้อีก บางครั้งเค้าอาจจะพูดไม่เก่งหรืออธิบายความรู้สึกตัวเองไม่ค่อยถูกเป็นไรไม่ค่อยยอมพูด แต่ทุกครั้งที่เค้าบอกว่ารักเธอ เค้ารู้สึกแบบนั้นจริงๆเลยนะ เค้าดีใจมากที่วันนั้นเราได้ลองเปิดใจให้กัน ดีใจที่ได้รู้จักเธอในหลายๆมุม ดีใจที่เธอเลือกเค้าดีใจที่เธอเกิดมา ดีใจที่มีเธอ

งืมอ่านจนถึงตรงนี้แฟนก็จะรู้ว่าเค้าไปเรื่อยมาก เค้าคิดถึงอนาคตของเราจัง ถ้ามหาลัยเธอไปไกลเค้าก็อยากจะเจอเธอบ่อยๆแต่ก็ค่อยว่ากันตอนนั้นละกันเนาะว่าเค้าไปหาเธอหรือเธอมาหาเค้า ถ้าได้อยู่ใกล้ๆกันก็คงจะดี เค้าอยากให้เรามีเวลาให้กันเยอะๆ แต่เค้าก็พร้อมให้เวลาส่วนตัวกับเธอเสมอเลยนะคะ อนาคตเค้ากับเธอก็ต่างต้องเติบโตสินะต้องมีเส้นทางของตัวเอง แต่เค้าขอให้เค้าเป็นส่วนนึงในเส้นทางเติบโตของเธอด้วยได้ไหมคะ อยากรอฟังเรื่องราวเรื่องเล่าใหม่ๆของเธอในทุกๆวันคุยกันในทุกๆวันกอดกันทุกวันทั้งวันที่มีความสุขแล้วก็ไม่มีความสุข เค้าอยากอยู่เส้นทางการเติมโตของเธอจริงๆนะ อยากเห็นเธอประสบความสำเร็จแล้วก็อยากให้เธออยู่ในวันที่เค้าประสบความสำเร็จอยู่ดูแลกันและกันต่างคนต่างมอบความรักให้กัน ความพร้อมดูแลเธอมากๆ อยากเห็นเธอได้ทำงานที่เธออยากทำ อยากพาเธอเที่ยวที่เธออยาไป อยากมีความสุขกับชีวิตที่ตัวเองเลือกแบบมีเธอข้างๆทุดวินาทีชีวิต ต่อให้ถ้าในอนาคตบางช่วงเวลาของเราจะไม่ได้อยู่ใกล้กันนานๆทีต้องเจอ เค้าก็พร้อมที่จะซื่อสัตย์ รอเธออยู่ตรงนี้รอวันที่เราจะได้อยู่ด้วยกัน เค้าจะไม่มีทางนอกใจผิดคำสัญญากับเธอ เค้าอยากให้เราทั้งคู่มีอิสระที่จะได้เติบโตอย่างเต็มที่ โดยไม่ต้องรู้สึกว่าการมีความรักจะทำให้เธอไปไม่ถึงความฝันของตัวเองเลยนะ เพราะเค้าอยากเห็นเธอมีความสุขกับชีวิตของเธอจริงๆ และเค้าก็อยากเติบโตไปพร้อมๆกับเธอเหมือนกันค่ะ เค้าก็ไม่รู้ว่ามีอะไรที่พิมพ์ซ้ำไปแล้วบ้างแต่ทั้งหมดก็มาจากใจจากความรู้สึกเค้าเลยนะ

ถึงอดีตตเค้าจะเจออะไรไม่ดียังกลัวยังกังวลอยู่ แต่เค้าจะไม่มีทางเอาเรื่องแบบนั้นมาทำกับเธอมาระแวงเธอแน่นอนอาจจะต้องใช้ความปรับตัวหน่อยแต่เค้าก็ปรับตัวได้มากแล้วนะฮือแฟนอะทำเค้าซึ้งเค้าไม่เคยเจออะไรดีๆในความสัมพันธ์ขนาดนี้มาก่อนเลยมันแบบเจออะไรนิดหน่อยเค้าก็กลัวเธอไม่โอเค กัลว่าเธอจะทิ้งเค้าไปกลัวจะไม่มีเธอ เค้าจะปรับตัวอีกกกกกรอดูเลยอ้วม เค้ารักเธอ เค้ารักเธอออออออออ

เค้าเชื่อว่าความรักที่ดีไม่จำเป็นต้องทำให้ทุกวันเป็นวันที่พิเศษเสมอไปหรอกนะคะ บางวันเราอาจจะมีเวลาให้กันเยอะ บางวันเราอาจจะยุ่งจนแทบไม่ได้คุยกัน หรือบางวันต่างคนต่างก็มีเรื่องของตัวเองให้จัดการ แต่เค้าอยากให้เรายังรู้สึกดีที่มีกันอยู่ อยากให้เราไม่ลืมว่าต่อให้วันนั้นจะวุ่นวายแค่ไหน เรายังสามารถแบ่งเวลาเล็กๆน้อยๆมาใส่ใจกันได้เสมอ เค้าไม่ได้ต้องการให้เธอว่างเพื่อเค้าตลอดเวลา และไม่ได้อยากให้เธอต้องละทิ้งสิ่งที่ตัวเองกำลังทำเพื่อมาดูแลความรู้สึกของเค้าทุกครั้ง แต่เค้าอยากให้เราเข้าใจกันและให้ความสำคัญกับเวลาที่เรามีร่วมกันมากๆเลยนะคะ แค่มีโอกาสได้เล่าเรื่องราวให้กันฟัง ได้ถามว่าวันนี้เป็นยังไงบ้าง หรือได้บอกหลับไม่ฝันกันก่อนนอน หรืออาจจะหลับใส่กันในวันทีเหนื่อย เค้าก็รู้สึกว่าความรักของเรายังมีพื้นที่เล็กๆที่อบอุ่นให้กันอยู่เสมอแล้ว งืมมม เค้าอยากให้เราเป็นแฟนที่รักกันมากๆ และก็เป็นคนสองคนที่ช่วยให้กันและกันมีชีวิตที่ดีขึ้นด้วย อยากให้เธอได้ทำสิ่งที่รัก ได้เจอเพื่อนที่ดี ได้เรียนรู้โลกกว้างๆ และได้ใช้ชีวิตอย่างที่ตัวเองต้องการ ส่วนเค้าก็จะค่อยๆเติบโตในทางของตัวเองเหมือนกัน แล้วเราค่อยกลับมาเล่าให้กันฟังว่าเราได้เรียนรู้อะไรบ้าง มีเรื่องไหนที่ทำให้เราเก่งขึ้น หรือมีอะไรที่ทำให้เราได้ยิ้มในวันนั้น เค้าอยากให้เรารักกันโดยที่ยังได้เป็นตัวเองอย่างเต็มที่

เค้าชอบวันครบรอบของเรานะแบบบางเดือนเราก้ได้ครบรอบกันในเดือนใหม่ บางเดือนก็ได้เซอร์ไพรกันครบรอบกันก่อนเดือนใหม่แบบเริ่มต้นเดือนดีๆกับแฟนน่ารักๆอ้วมๆ อยากมีวันที่เราได้ไปเที่ยวด้วยกันหลายๆที่ อยากพาเธอไปกินของอร่อยๆ อยากเดินเล่นด้วยกันแบบไม่ต้องรีบร้อน อยากขับรถเล่นฟังเพลงไปเรื่อยๆในวันที่ไม่มีอะไรต้องทำ อยากแวะซื้อขนมที่เธอชอบให้เธอได้กิน อยากมีวันที่เราถ่ายรูปด้วยกันเยอะๆจนกลับมาเลือกไม่ถูกว่าจะลงรูปไหนดี อยากมีรูปเธอเก็บไว้ในโทรศัพท์เยอะๆ อยากได้รูปที่เธอเผลอยิ้มโดยไม่รู้ตัว อยากมีคลิปที่เราหัวเราะกับเรื่องอะไรสักอย่างจนหน้าแดงแป๊ดไปหมด แล้ววันหนึ่งพอเรากลับมาเปิดดูอีกครั้ง เราจะได้ยิ้มกับความทรงจำเหล่านั้นไปด้วยกัน เค้าอยากมีเรื่องราวที่เป็นของเราสองคนเยอะๆเลยนะคะ อยากให้มีเพลงบางเพลงที่พอฟังแล้วนึกถึงกัน อยากให้มีสถานที่บางแห่งที่พอผ่านไปแล้วทำให้นึกถึงวันที่เราเคยไปด้วยกัน อยากให้มีเมนูอาหารบางอย่างที่พอเห็นแล้วก็อดคิดไม่ได้ว่าแฟนเราชอบกินอันนี้นี่ซื้อไปฝากดีกว่า เค้าอยากให้ชีวิตของเราค่อยๆเต็มไปด้วยความทรงจำเล็กๆที่มีความหมาย

แล้วก็มีอีกอย่างที่เค้าอยากบอกเธอมากๆเลยนะ เค้าอยากให้เธอรู้ว่าความรักที่เค้ามีให้เธอไม่ได้ขึ้นอยู่กับว่าเธอจะต้องทำอะไรให้เค้าประทับใจตลอดเวลาหรือเปล่า เธอไม่ต้องพยายามเป็นแฟนที่สมบูรณ์แบบ ไม่ต้องคอยทำให้เค้ามีความสุขทุกวินาที และไม่ต้องกลัวว่าตัวเองจะไม่น่ารักในวันที่เหนื่อยหรืออารมณ์ไม่ดีเลยนะคะ เค้าเองก็ยังมีหลายอย่างที่ต้องเรียนรู้เหมือนกัน เค้าอยากให้เราค่อยๆเรียนรู้กันไป อยากให้เราได้พูดคุยกันอย่างตรงไปตรงมา และอยากให้เราเป็นพื้นที่ที่สามารถบอกความรู้สึกของตัวเองได้โดยไม่ต้องกลัวว่าจะถูกมองไม่ดี ถ้าวันไหนเค้าทำอะไรที่ไม่โอเค เธอบอกเค้าได้เลยนะ เค้าจะตั้งใจฟังและพยายามเข้าใจว่าเธอรู้สึกยังไง เค้าไม่อยากให้เธอต้องฝืนยิ้มหรือแกล้งบอกว่าไม่เป็นไรเพียงเพราะกลัวว่าเค้าจะเสียใจ เพราะความรู้สึกของเธอก็สำคัญกับเค้ามากเหมือนกัน เค้าอยากให้เราช่วยกันดูแลความสัมพันธ์นี้ ไม่ใช่ให้ใครคนใดคนหนึ่งต้องพยายามอยู่ฝ่ายเดียว อยากให้เรารู้สึกว่าความรักของเรามีพื้นที่สำหรับการเรียนรู้ การขอโทษ การให้อภัย และการเริ่มต้นทำสิ่งต่างๆให้ดีขึ้นได้เสมอเลยนะคะ เค้าอาจจะไม่ได้ทำได้ถูกต้องทุกครั้ง แต่เค้าจะพยายามเป็นคนที่รับฟังเธอด้วยความตั้งใจ และไม่มองข้ามสิ่งที่เธอรู้สึกเลยแม้แต่นิดเดียว พร้อมกอดๆแฟน

เค้าเองก็อยากเป็นแฟนที่ดีขึ้นสำหรับเธอในทุกๆวันนะคะ ไม่ใช่แค่พูดว่ารักมากขึ้น แต่เค้าอยากให้เธอรู้สึกถึงความรักนั้นได้จากสิ่งที่เค้าทำด้วย อยากจำรายละเอียดเล็กๆของเธอให้ได้มากขึ้น อยากรู้ว่าเธอชอบอะไร อยากกินอะไร หรือมีเรื่องไหนที่เธอกำลังตั้งใจทำอยู่ อยากเป็นคนที่ใส่ใจแม้กระทั่งเรื่องเล็กๆที่เธออาจจะไม่ได้คิดว่ามันสำคัญ เค้าอยากเรียนรู้ว่าจะดูแลความรู้สึกของเธอได้ยังไงให้ดีกว่าเดิม อยากรู้ว่าเวลาเธอเหนื่อย เธออยากให้เค้าทำอะไร เวลาเธอมีความสุข เธออยากแบ่งปันเรื่องแบบไหน และเวลาเราไม่เข้าใจกัน เราจะคุยกันยังไงให้ต่างคนต่างรู้สึกว่าได้รับการรับฟัง เค้าไม่อยากเป็นแค่คนที่เธอรัก แต่เค้าอยากเป็นคนที่เธอรู้สึกว่าความสัมพันธ์นี้มีความหมายและคุ้มค่ากับการดูแลจริงๆนะคะ เค้าอยากให้เรายังเลือกที่จะทำความเข้าใจกัน แม้ในวันที่ความคิดของเราไม่ตรงกัน อยากให้เราไม่รีบปล่อยมือจากกันเพียงเพราะเจอเรื่องยากๆ และอยากให้เราจำไว้ว่าการรักกันให้ดีขึ้นเป็นสิ่งที่เราค่อยๆเรียนรู้ได้ ไม่จำเป็นต้องรู้วิธีทั้งหมดตั้งแต่วันแรกเลยงืม เค้าก็ยังมีอะไรให้เรียนรู้อีกเยอะมากๆ แต่เค้าก็อยากเรียนรู้สิ่งเหล่านั้นไปพร้อมกับเธอนะคะ

บางครั้งเค้าก็แอบคิดเหมือนกันว่าทำไมตัวเองถึงรักเธอได้มากขนาดนี้ ทั้งที่บางทีเธอก็ไม่ได้ทำอะไรพิเศษเลย แค่เป็นเธอในแบบที่เธอเป็น เค้าก็รู้สึกว่ามันน่ารักมากๆ เค้าชอบมองเธอจนเธอถามว่าทำไมมองแบบนั้นทำไมมองเค้าอีกแล้วก็มันน่ารักนี่แฟนเค้าน่ารักอะอยากมอง เค้าชอบเวลาที่เธอเล่าเรื่องที่ตัวเองสนใจ ชอบเวลาที่เธอตั้งใจทำอะไรบางอย่าง ชอบเวลาที่เธอดีใจจนอยากรีบมาเล่าให้เค้าฟัง ชอบเวลาที่เธอส่งอะไรมาให้ดูเพราะนึกถึงเค้า และชอบเวลาที่เราต่างคนต่างเป็นตัวเองได้โดยไม่ต้องพยายามทำให้ทุกอย่างดูสมบูรณ์แบบ เค้าชอบความเป็นเธอในรายละเอียดเล็กๆที่บางครั้งเธอเองอาจไม่ทันสังเกตด้วยซ้ำ เค้าไม่ได้รักเธอเพียงเพราะช่วงเวลาที่เธอน่ารักหรือวันที่ทุกอย่างเป็นไปอย่างใจ แต่เค้ารักเธอในฐานะคนคนหนึ่งที่เค้า อยากเข้าใจความคิดของเธอ อยากรู้จักความฝันของเธอ และอยากเรียนรู้ว่ามีอะไรบ้างที่ทำให้เธอเป็นเธอในวันนี้ เค้าอยากให้เรายังมีโอกาสได้ค้นพบมุมใหม่ๆของกันและกันต่อไป แม้จะรักกันไปอีกนานแค่ไหนก็ตามนะคะ เค้าอยากให้ความรักของเราไม่ใช่แค่ความรู้สึกที่สวยงามในช่วงหนึ่ง แต่เป็นความรู้สึกที่เรายังคอยเติมเต็มให้กันได้ในวันที่เวลาผ่านไป และยังทำให้รู้สึกโชคดีที่ได้มีกันอยู่เสมอเลย

เค้าดีใจมากๆที่วันนั้นได้ลองเปิดใจให้เธอนะ ดีใจเหมือนกันที่เธอเปิดใจเลือกเค้า ก่อนหน้านี้เค้าอาจจะไม่ได้คิดว่าตัวเองจะมีความรักที่ทำให้รู้สึกอบอุ่นได้ขนาดนี้ เค้าอาจจะมีความกลัว มีความไม่แน่ใจ หรือมีหลายเรื่องที่ยังไม่กล้าคาดหวังมากนัก แต่พอได้รู้จักเธอ ได้เรียนรู้ว่าเธอเป็นคนแบบไหน และได้เห็นความน่ารักของเธอในแต่ละวัน เค้าก็ค่อยๆรู้สึกว่าการมีใครสักคนให้รักมันเป็นเรื่องที่ดีมากจริงๆเลยนะคะ เค้าดีใจที่เราได้เจอกัน ดีใจที่เราได้ลองเปิดใจให้กัน และดีใจที่เราได้มีโอกาสสร้างความสัมพันธ์นี้ขึ้นมาด้วยกัน เค้าไม่ได้คิดว่าทุกอย่างจะต้องง่ายเสมอไป แต่เค้าอยากให้เรามีโอกาสได้เรียนรู้และเติบโตไปด้วยกัน เค้าอยากให้เธอรู้ว่าเค้าจริงจังกับคำว่าตลอดไปที่เค้าพูดนะ เค้าไม่ได้รู้ว่าอนาคตทุกอย่างจะเป็นยังไง แต่เค้ารู้ว่าตอนนี้เค้าอยากมีเธออยู่ในอนาคตของเค้าจริงๆ อยากให้เราได้มีวันธรรมดาๆร่วมกันอีกเยอะๆ อยากให้เราได้ฉลองความสำเร็จของกันและกัน อยากให้เราได้เห็นวันที่อีกคนทำตามความฝันสำเร็จ และอยากให้เรายังเป็นคนที่สามารถหันมาแบ่งปันความรู้สึกให้กันได้เสมอ เค้าจะพยายามทำให้ความรักครั้งนี้เป็นความรักที่เราได้ดูแลกันอย่างดี ไม่ใช่เพียงแค่รักกันมากๆในวันนี้ แต่ยังรู้จักรักษาความรู้สึกของกันและกันในวันต่อๆไปด้วยนะคะ

เค้าไม่สัญญาว่าตัวเองจะไม่ผิดพลาดเลย เพราะเค้าก็ยังเป็นคนธรรมดาที่มีเรื่องต้องเรียนรู้อีกเยอะ แต่เค้าสัญญาว่าจะไม่หยุดพยายามเป็นคนรักที่ดีขึ้น เค้าจะพยายามคิดถึงความรู้สึกของเธอให้มากขึ้น จะพยายามพูดคุยกันด้วยความใจเย็น และจะไม่มองข้ามปัญหาเพียงเพราะคิดว่าเดี๋ยวมันก็คงผ่านไปเอง เค้าอยากให้เราสามารถบอกกันได้ว่าตรงไหนที่รู้สึกไม่ดี ตรงไหนที่อยากให้ปรับ หรือมีอะไรที่อยากให้เราทำร่วมกันมากขึ้น เค้าอยากให้ความสัมพันธ์ของเราเป็นสิ่งที่เราทั้งคู่ช่วยกันรักษา ไม่ใช่สิ่งที่ต้องอาศัยความพยายามจากคนใดคนหนึ่งเพียงฝ่ายเดียว เค้าพร้อมจะรับฟังเธอ และเค้าก็อยากให้เธอรับฟังเค้าเหมือนกัน เราค่อยๆปรับตัวเข้าหากัน ค่อยๆเรียนรู้วิธีรักกันในแบบที่ทำให้เราทั้งคู่มีความสุขมากขึ้นนะคะ เค้าอยากให้เธอมั่นใจว่าเค้ารักเธอจริงๆ และจะพยายามแสดงความรักนั้นออกมาให้เธอเห็นมากขึ้นในทุกๆวัน เพราะเค้าอยากให้เธอรู้สึกได้ว่าเธอมีความหมายกับเค้า ไม่ใช่เพียงจากคำพูดหวานๆที่เค้าพิมพ์ให้ แต่จากการที่เค้ายังคงตั้งใจรักษาความสัมพันธ์ของเราอยู่เสมอด้วยค่ะ เค้าอยากบอกขอบคุณเธอมากๆเลยนะคะ ขอบคุณที่เข้ามาเป็นความน่ารักในชีวิตของเค้า ขอบคุณที่ทำให้เค้ามีใครสักคนให้คิดถึงในระหว่างวัน ขอบคุณที่ทำให้เค้าอยากเล่าเรื่องราวต่างๆให้ใครสักคนฟัง และขอบคุณที่ทำให้วันธรรมดาหลายๆวันมีความหมายมากขึ้นกว่าเดิม เค้าไม่รู้ว่าเธอจะรู้ตัวไหมว่าเธอทำให้เค้ามีความสุขได้มากขนาดไหน แต่เค้าอยากให้เธอรู้ไว้นะคะว่าเค้าดีใจจริงๆที่มีเธออยู่ตรงนี้ ดีใจที่ได้เรียกเธอว่าแฟน และดีใจที่ได้เป็นคนที่มีโอกาสรักเธอ เค้าอาจจะพิมพ์อะไรซ้ำๆบ้าง แฟนอ่านแล้วอาจจะบอกว่างืมมม พูดอีกแล้ว แต่เค้าก็ยังอยากบอกอยู่ดี เพราะบางความรู้สึกมันมีค่ามากเกินกว่าจะเก็บไว้ในใจเฉยๆ เค้าอยากให้เธอได้อ่านแล้วรู้สึกถึงความรักของเค้า อยากให้เธอยิ้มออกมาเล็กๆตอนอ่านข้อความนี้ และอยากให้เธอรู้ว่ามีคนคนหนึ่งที่ดีใจมากๆที่ได้มีเธอเป็นส่วนหนึ่งในชีวิต เค้าไม่รู้ว่าจะมีคำพูดไหนที่อธิบายได้ครบทุกอย่าง แต่ถ้าจะให้เค้าพูดสั้นๆก็คงเป็นคำว่าเค้าดีใจที่เป็นเธอจริงๆนะคะ

เค้าอยากให้ข้อความนี้เป็นเหมือนจดหมายเล็กๆจากเดือนพฤศจิกายนที่เก็บความรู้สึกของเค้าเอาไว้ เป็นหลักฐานเล็กๆว่าในช่วงเวลาหนึ่ง เค้ามีความสุขกับการได้รักเธอมากขนาดไหน เค้าตั้งใจอวยพรให้เธอมากแค่ไหน และเค้าหวังกับอนาคตของเรามากแค่ไหน ถ้าวันหนึ่งเธอกลับมาอ่านอีกครั้ง เค้าก็หวังว่าเธอจะยังยิ้มได้กับคำพูดเหล่านี้ และหวังว่าเราจะมีเรื่องราวดีๆให้ย้อนกลับมานึกถึงด้วยกันอีกเยอะเลยนะคะ เค้าอยากให้เราได้สะสมความทรงจำไปเรื่อยๆ ไม่ต้องรีบ ไม่ต้องเร่งให้ทุกอย่างเป็นไปตามที่คิด แค่ค่อยๆเดินไปด้วยกัน ให้เวลากับตัวเองและให้เวลากับความสัมพันธ์ของเรา เค้าก็คิดว่ามันเป็นเรื่องที่น่ารักมากๆแล้วค่ะ เค้าขอให้เดือนพฤศจิกายนเป็นเดือนที่ใจดีกับเธอมากๆนะคะ ขอให้เธอได้เจอข่าวดีที่รอคอย ขอให้ความพยายามที่ผ่านมาค่อยๆออกผล ขอให้เธอมีแรงทำสิ่งที่ตัวเองรัก ขอให้มีเวลาพักผ่อนอย่างเพียงพอ และขอให้ทุกๆวันมีเรื่องเล็กๆที่ทำให้เธอรู้สึกว่าชีวิตยังน่ารักอยู่เสมอ ขอให้เธอได้กินอาหารอร่อยๆที่อยากกิน ได้ฟังเพลงที่ชอบ ได้ไปในสถานที่ที่อยากไป ได้เจอผู้คนที่ทำให้รู้สึกสบายใจ และได้ใช้เวลากับสิ่งที่ทำให้หัวใจของเธอมีความสุขนะคะ ขอให้การเรียนและการเตรียมตัวเข้ามหาลัยของเธอเป็นไปอย่างราบรื่น ขอให้เธอมีสมาธิในวันที่ต้องตั้งใจ มีความมั่นใจในวันที่ต้องลงมือทำ และมีแรงใจในวันที่รู้สึกเหนื่อย เค้าอยากให้เธอได้เห็นความสำเร็จของตัวเองทีละก้าว และไม่ลืมว่าทุกวันที่เธอพยายามล้วนมีความหมาย เค้าจะคอยดีใจกับทุกเรื่องที่เธอทำสำเร็จเลยนะ ไม่ว่าจะเป็นเรื่องใหญ่ที่เธอเฝ้ารอ หรือเรื่องเล็กๆที่เธออาจคิดว่าไม่สำคัญ เค้าก็อยากรับรู้และร่วมยินดีกับเธอเสมอเลยค่ะ พูดซ้ำรอบที่เอนไหมนะเค้า

Happy November kup ter 🩶 ขอให้เดือนนี้เป็นเดือนที่น่ารักกับแฟนของเค้ามากๆเลยนะคะ ขอให้ทุกความฝันของเธอค่อยๆเข้าใกล้ความจริง ขอให้ทุกสิ่งที่เธอตั้งใจไว้เป็นไปในทางที่ดี ขอให้เธอมีวันที่ได้ยิ้มกว้างๆ มีวันที่หัวเราะจนเหนื่อย มีวันที่ได้ภูมิใจในตัวเอง และมีวันที่รู้สึกว่าความพยายามของตัวเองไม่สูญเปล่าเลยนะคะ เค้าอยากเห็นเธอมีความสุขกับชีวิต อยากเห็นเธอได้ทำสิ่งที่รัก อยากเห็นเธอประสบความสำเร็จในแบบที่เธอใฝ่ฝัน และอยากเป็นคนที่ได้ยินเธอเล่าเรื่องราวเหล่านั้นด้วยความตื่นเต้นเสมอ ส่วนเค้าก็จะตั้งใจเป็นแฟนที่ดีขึ้น ตั้งใจดูแลความรู้สึกของเรา และตั้งใจสร้างความทรงจำดีๆกับเธอไปเรื่อยๆเลยนะคะ เค้าอยากมีเธออยู่ในเดือนพฤศจิกายน อยากมีเธออยู่ในเดือนธันวาคม และอยากมีเธออยู่ในทุกเดือนทุกปี อยากให้เรายังได้ส่งคำอวยพรให้กันในวันแรกของเดือน ได้บอกคิดถึงกันในวันที่คิดถึง ได้เล่าเรื่องราวในแต่ละวันให้กันฟัง และได้ใช้เวลาร่วมกันในแบบที่ทำให้เราทั้งคู่มีความสุข เค้าอยากให้วันหนึ่งเรามองย้อนกลับมาแล้วพูดกับกันและกันได้ว่า ดีใจจังเลยเนอะที่วันนั้นเราได้เจอกัน ดีใจที่ได้ลองเปิดใจให้กัน และดีใจที่เราตั้งใจรักษาความรักของเรามาจนถึงวันนี้ เค้ารักเธอมากๆเลยนะคะ My gravity ของเค้า 🩶 รักแบบที่ยังอยากรู้จักเธอให้มากขึ้นในทุกๆวัน รักแบบที่ยังตื่นเต้นเวลาได้ฟังเรื่องราวของเธอ รักแบบที่ยังอยากมีเธออยู่ในวันพรุ่งนี้และวันต่อๆไป เค้าอาจจะไม่รู้ว่าตลอดเส้นทางข้างหน้าจะมีเรื่องอะไรเข้ามาบ้าง แต่เค้ารู้ว่าตอนนี้เค้าอยากเดินไปข้างหน้าพร้อมกับเธอ อยากให้เราได้สร้างเรื่องราวดีๆด้วยกันอีกเยอะๆ อยากเห็นเธอมีความสุขกับสิ่งที่เลือก และอยากให้เธอรู้ว่าเธอมีคนที่คอยเอาใจช่วยอยู่ตรงนี้เสมอเลยนะคะ พรเดือนพฤศจิกายนของเค้า เค้ายกสิ่งดีๆทุกอย่างให้เธอหมดเลย ขอให้เธอโชคดี ขอให้สมหวัง ขอให้มีรอยยิ้มเยอะๆ ขอให้มีคนใจดีกับเธอ ขอให้ทุกวันที่เหนื่อยมีวันพักที่ดีรออยู่ และขอให้เธอได้ใช้ชีวิตในแบบที่ตัวเองต้องการอย่างมีความสุข ส่วนเค้าก็ขอแค่ได้มีโอกาสรักเธอต่อไป ได้เป็นส่วนหนึ่งในเรื่องราวของเธอ ได้ร่วมยินดีในวันที่เธอประสบความสำเร็จ และได้เป็นแฟนที่เธอรู้สึกดีใจที่มีอยู่ในชีวิตก็พอแล้วค่ะ งืมมม จริงๆก็ขออีกอย่างนึง เค้าขอให้เราได้รักกันไปนานๆเลยนะ ขอให้เราได้จับมือกันผ่านอีกหลายๆเดือน หลายๆปี ได้เติบโตไปพร้อมกัน และได้สร้างความทรงจำที่สวยงามด้วยกันไปเรื่อยๆ เค้ารักเธอมากๆนะคะ ขอบคุณที่เป็นเธอ ขอบคุณที่เข้ามาในชีวิตเค้า และขอบคุณที่ทำให้เค้าได้รู้ว่าการมีใครสักคนให้รักมันเป็นความรู้สึกที่น่ารักมากขนาดนี้ ขอให้พฤศจิกายนนี้ใจดีกับเธอที่สุดเลยนะคะ แฟนของเค้า 🫶🏻🩶`,

var $ = function(id){ return document.getElementById(id); };
$('to').textContent = CONFIG.to; $('from').textContent = CONFIG.from;
$('hello').textContent = CONFIG.hello; $('letter').textContent = CONFIG.letter;

// ใส่รหัสผ่านเพื่อเปิดคลิป
function tryPw(){
  var v = $('pw').value.replace(/\D/g, '');
  if (v === CONFIG.password) {
    $('lock').style.display = 'none';
    var c = CONFIG.video, w = $('vid');
    w.hidden = false;
    w.innerHTML = c.src ? '<video controls playsinline preload="metadata" src="'+encodeURI(c.src)+'#t=0.1"></video>' : '<div class="vph">🎬<small>คลิปจะมาอยู่ตรงนี้</small></div>';
    var vv = w.querySelector('video');
    if (c.src) {
      w.insertAdjacentHTML('beforeend', '<button class="vtog" id="vtog">ดูทั้งคลิป</button>');
      $('vtog').addEventListener('click', function(){ var f = w.classList.toggle('fit'); this.textContent = f ? 'เต็มกรอบ' : 'ดูทั้งคลิป'; });
    }
    if (vv && window.MUSIC) { vv.addEventListener('play', MUSIC.hold); vv.addEventListener('pause', MUSIC.release); vv.addEventListener('ended', MUSIC.release); }
    leaves(24);
  } else {
    $('note').textContent = 'รหัสไม่ถูกนะ ลองใหม่อีกที 💗';
    var l = $('lock'); l.classList.remove('wig'); void l.offsetWidth; l.classList.add('wig');
    $('pw').value = '';
  }
}
$('pwbtn').addEventListener('click', tryPw);
$('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') tryPw(); });

// เช็กลิสต์ (จำค่าไว้ในเครื่องของคนเปิด)
var saved = [];
try { saved = JSON.parse(localStorage.getItem('nov-todo') || '[]'); } catch(e){}
$('todo').innerHTML = CONFIG.todo.map(function(t, i){
  return '<label><input type="checkbox" data-i="'+i+'"'+(saved.indexOf(i) > -1 ? ' checked' : '')+'><span>'+t+'</span></label>';
}).join('');

  leaves(5);
});

// เพลงประกอบ: เล่นตั้งแต่เปิดเว็บ วนซ้ำ และหยุดเฉพาะตอนเล่นวิดีโอ
(function(){
  var src = CONFIG.music.src, pl = $('player');
  $('ptitle').textContent = CONFIG.music.title;
  if (!src) { pl.hidden = true; return; }
  var a = new Audio(encodeURI(src)), want = true, started = false, holding = false;
  a.loop = true; a.preload = 'auto';
  function ui(on){ $('pbtn').textContent = on ? '⏸' : '▶'; pl.classList.toggle('on', on); pl.classList.toggle('pulse', !on && !started); }
  function play(){ a.play().then(function(){ started = true; ui(true); }, function(){ ui(false); }); }
  window.MUSIC = {
    hold: function(){ holding = true; if (!a.paused) { a.pause(); ui(false); } },
    release: function(){ holding = false; if (want) play(); },
    start: function(){ want = true; if (!holding) play(); }
  };
  $('pbtn').addEventListener('click', function(){
    if (a.paused) { want = true; if (!holding) play(); } else { want = false; a.pause(); ui(false); }
  });
  // เบราว์เซอร์มักบล็อกเสียงอัตโนมัติ จึงลองเล่นทันที และเล่นให้อีกครั้งตอนแตะหน้าจอครั้งแรก
  var evs = ['pointerdown','keydown','touchend'];
  function first(e){
    if (e.target.closest && e.target.closest('#player')) return;
    evs.forEach(function(n){ document.removeEventListener(n, first); });
    if (want && !holding && a.paused) play();
  }
  evs.forEach(function(n){ document.addEventListener(n, first); });
  play();
})();

// หน้าจอต้อนรับ: แตะ 1 ครั้งเพื่อเริ่มเพลง (เบราว์เซอร์ไม่ให้เล่นเสียงเองก่อนมีการแตะ)

// ใบไม้ร่วง
function leaf(){
  var l = document.createElement('div'), ic = ['🍂','🍁','🌸','🍃','💗'];
  l.className = 'leaf'; l.textContent = ic[Math.floor(Math.random()*ic.length)];
  l.style.left = Math.random()*100+'vw'; l.style.fontSize = (16+Math.random()*18)+'px';
  l.style.animationDuration = (6+Math.random()*6)+'s';
  document.body.appendChild(l); setTimeout(function(){ l.remove(); }, 12500);
}
function leaves(n){ for (var i = 0; i < n; i++) setTimeout(leaf, i*110); }
setInterval(leaf, 1500); leaves(8);
